name = "gtqc-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# API publique du site GTQC : données (/donnees), GTQC TV (/twitch), formulaire (/inscription).
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.gtqc.net", custom_domain = true }]

# Toutes les 5 minutes : la copie des données est rafraîchie d'avance (le site n'attend jamais le script).
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Adresses du site autorisées à lire l'API (séparées par des virgules). localhost est toujours permis.
ORIGINES = "https://gtqc.net,https://www.gtqc.net"

# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put SCRIPT_URL           adresse /exec de l'application web Apps Script GTQC
#   npx wrangler secret put SCRIPT_SECRET        propriété SECRET du script (fonction creerSecret)
#   npx wrangler secret put TWITCH_CLIENT_ID     dev.twitch.tv → Console → Applications (même appli que LNHQ possible)
#   npx wrangler secret put TWITCH_CLIENT_SECRET
