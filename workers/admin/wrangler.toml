name = "gtqc-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Admin GTQC : joignable seulement par admin.gtqc.net, derrière Cloudflare Access
# (l'adresse *.workers.dev permettrait de contourner Access, d'où workers_dev = false).
workers_dev = false
preview_urls = false
routes = [{ pattern = "admin.gtqc.net", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Zero Trust → Access → Applications → (l'application admin GTQC) → Vue d'ensemble.
ACCESS_TEAM_DOMAIN = "https://EQUIPE.cloudflareaccess.com"
ACCESS_AUD = ""
# Modèle qui lit les captures de résultats GT7 (alias : toujours le Flash le plus récent).
GEMINI_MODEL = "gemini-flash-latest"

# Secrets (jamais dans ce fichier), mêmes valeurs que pour gtqc-api :
#   npx wrangler secret put SCRIPT_URL
#   npx wrangler secret put SCRIPT_SECRET
#   npx wrangler secret put GEMINI_KEY      (clé gratuite Google AI Studio : lecture des captures de résultats)
