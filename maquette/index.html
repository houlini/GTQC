<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTQC Courses</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Calendrier, classement et résultats de la ligue Gran Turismo Québec (GTQC).">
<link rel="preconnect" href="https://api.gtqc.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">

<header class="topbar" id="topbar">
  <a class="brand" href="#" aria-label="GTQC, accueil"><img id="logo" alt="GTQC"></a>
  <nav class="nav" aria-label="Navigation principale">
    <a href="index.html" aria-current="page">Courses</a>
    <a href="pilotes.html">Pilotes</a>
    <a href="evenements.html">Événements</a>
    <a href="reglements.html">Règlements</a>
    <a href="tv.html">GTQC TV</a>
    <a href="rejoindre.html">Rejoindre</a>
  </nav>
  <button class="menu-btn" type="button" aria-label="Menu"><span aria-hidden="true">≡</span> Menu</button>
</header>

<main>
  <!-- Calendrier : rail de dates + manche en vedette -->
  <section class="hero" id="hero" aria-label="Calendrier">
    <div class="hero-bg" id="heroBg"></div>
    <div class="season-switch" id="seasonSwitch" role="tablist" aria-label="Saison"></div>
    <div class="rail-wrap">
      <button class="rail-arrow up" id="railUp" type="button" aria-label="Manche précédente">‹</button>
      <ol class="rail" id="rail" aria-label="Manches"></ol>
      <button class="rail-arrow down" id="railDown" type="button" aria-label="Manche suivante">›</button>
    </div>
    <span class="rail-line" aria-hidden="true"></span>
    <div class="event" id="event" aria-live="polite"></div>
  </section>

  <!-- Classement -->
  <section class="standings" id="classement">
    <div class="st-side">
      <h2>Classement<br>général</h2>
      <div class="toggle" id="toggle"></div>
      <p class="st-note" id="stNote"></p>
    </div>
    <div class="st-list">
      <ol class="rows" id="rows"></ol>
      <div class="more-wrap" id="moreWrap"><button class="pill-btn" id="moreBtn" type="button">Voir plus</button></div>
    </div>
  </section>

  <!-- Résultats -->
  <section class="results" id="resultats">
    <div class="res-head">
      <div class="res-title">
        <h2>Résultats</h2>
        <div class="chips" id="chartMode" role="group" aria-label="Type de graphique"></div>
        <p class="sub" id="chartSub"></p>
      </div>
      <div class="picker" id="picker">
        <button class="picker-btn" id="pickerBtn" type="button" aria-expanded="false">Choisir les pilotes <span aria-hidden="true">⌄</span></button>
        <div class="picker-pop" id="pickerPop" hidden></div>
      </div>
    </div>
    <div class="chart-box"><svg id="chart" role="img" aria-label="Position au classement après chaque manche"></svg></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- Partenaires -->
  <section class="partners" aria-label="Partenaires">
    <div class="partner-row" id="partners"></div>
  </section>
</main>

<footer class="foot">
  <div class="foot-grid">
    <div>
      <img class="foot-logo" id="logo2" alt="GTQC">
      <p class="small">Gran Turismo Québec · Communauté de sim racing 100 % québécoise</p>
    </div>
    <div><h3>Soir de course</h3><div id="horaire"></div></div>
    <div><h3>Suivre la ligue</h3><ul class="links" id="links"></ul><p class="mail" id="mail"></p></div>
  </div>
  <p class="small copy">© GTQC Gran Turismo Québec · Tracés : Gran Turismo Wiki</p>
</footer>

<!-- Fiche de la manche (s'ouvre avec « Voir la manche ») -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <button class="drawer-close" type="button" data-close aria-label="Fermer">×</button>
    <div id="drawerBody"></div>
  </aside>
</div>

<script src="chargeur.js" data-scripts="commun.js app.js"></script>
